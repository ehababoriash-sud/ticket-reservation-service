services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/tickets
      DB_USER: tickets
      DB_PASSWORD: tickets
      PORT: 8080
      HOLD_DURATION: ${HOLD_DURATION:-PT10M}
      EXPIRY_SWEEP_MS: ${EXPIRY_SWEEP_MS:-30000}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
